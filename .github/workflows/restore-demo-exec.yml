name: Restore demo executable bits

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-demo-exec.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore +x on demo scripts and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git update-index --chmod=+x \
            demos/setup.sh \
            demos/04-freeze-session.sh \
            demos/_lib.sh
          if git diff --cached --quiet; then
            echo "Executable bits already correct"
            exit 0
          fi
          git commit -m "Restore executable bits on demos setup/freeze/_lib (CI Documentation Check)"
          git push
